name: Zero Trust Assessment

on:
  workflow_dispatch:
    inputs:
      pillar:
        description: 'Pillar to assess: All, Identity, Devices, Network, Data, Infrastructure, SecOps, AI'
        required: false
        default: 'All'
        type: choice
        options:
          - All
          - Identity
          - Devices
          - Network
          - Data
          - Infrastructure
          - SecOps
          - AI
      days:
        description: 'Number of days to query sign-in logs (1-30)'
        required: false
        default: '7'
        type: string
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  run-zero-trust-assessment:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          allow-no-subscriptions: true

      - name: Install and import ZeroTrustAssessment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $moduleName = 'ZeroTrustAssessment'

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
          Import-Module Microsoft.PowerShell.PSResourceGet -Force
          Install-PSResource -Name $moduleName -Scope CurrentUser -TrustRepository -Repository PSGallery -Quiet -ErrorAction Stop

          $resource = Get-PSResource $moduleName -ErrorAction Stop
          $moduleRoot = $resource.InstalledLocation
          if (-not $moduleRoot) { throw 'ZeroTrustAssessment InstalledLocation is empty.' }

          $manifest = Get-ChildItem -Path $moduleRoot -Recurse -Filter "$moduleName.psd1" -File | Select-Object -First 1
          if (-not $manifest) { throw "Unable to find $moduleName.psd1 under $moduleRoot" }

          Import-Module $manifest.FullName -Force -Verbose
          Get-Command Connect-ZtAssessment -ErrorAction Stop | Format-Table Name,Source -AutoSize

      - name: Run Zero Trust Assessment
        shell: powershell
        env:
          ZT_PILLAR: ${{ inputs.pillar || 'All' }}
          ZT_DAYS: ${{ inputs.days || '7' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $reportPath = Join-Path $env:GITHUB_WORKSPACE 'ZeroTrustReport'
          New-Item -ItemType Directory -Path $reportPath -Force | Out-Null

          Connect-ZtAssessment -TenantId ${{ secrets.AZURE_TENANT_ID }} -Environment Global -Service 'All'
          Invoke-ZtAssessment -Path $reportPath -Pillar $env:ZT_PILLAR -Days [int]$env:ZT_DAYS -NoBrowser -ShowLog

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-trust-report
          path: ${{ github.workspace }}/ZeroTrustReport
