name: Zero Trust Assessment

on:
  workflow_dispatch:
    inputs:
      pillar:
        description: 'Pillar to assess: All, Identity, Devices, Network, Data, Infrastructure, SecOps, AI'
        required: false
        default: 'All'
        type: choice
        options:
          - All
          - Identity
          - Devices
          - Network
          - Data
          - Infrastructure
          - SecOps
          - AI
      days:
        description: 'Number of days to query sign-in logs (1-30)'
        required: false
        default: '7'
        type: string
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read
  id-token: write

jobs:
  run-zero-trust-assessment:
    name: Run Zero Trust Assessment
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-PSResource -Name ZeroTrustAssessment -Scope CurrentUser -TrustRepository -Quiet -ErrorAction Stop
          Install-Module Microsoft.Graph.Authentication -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop

      - name: Connect to tenant using the runner's logged-in context
        shell: pwsh
        env:
          ZT_PILLAR: ${{ inputs.pillar || 'All' }}
          ZT_DAYS: ${{ inputs.days || '7' }}
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module ZeroTrustAssessment -Force -ErrorAction Stop

          Write-Host 'This workflow expects the self-hosted runner to already be signed in to the Microsoft 365 tenant.'
          Write-Host 'That matches the official Microsoft Zero Trust Assessment flow: install module, connect to the tenant, then run the assessment.'

          try {
            Connect-ZtAssessment -UseTokenCache -Force
          }
          catch {
            Write-Host 'The runner does not currently have a valid Microsoft 365 tenant token cache. Please sign in to the self-hosted runner session and rerun.'
            throw
          }

          $context = Get-MgContext -ErrorAction SilentlyContinue
          if (-not $context) {
            throw 'No active Microsoft Graph context was found on the self-hosted runner. Please authenticate to the tenant first.'
          }

          Write-Host "Authenticated as: $($context.Account)"
          Write-Host "Tenant: $($context.TenantId)"

      - name: Run Zero Trust Assessment
        shell: pwsh
        env:
          ZT_PILLAR: ${{ inputs.pillar || 'All' }}
          ZT_DAYS: ${{ inputs.days || '7' }}
        run: |
          $ErrorActionPreference = 'Stop'

          $reportPath = Join-Path $env:GITHUB_WORKSPACE 'ZeroTrustReport'
          New-Item -ItemType Directory -Path $reportPath -Force | Out-Null

          $days = [int]$env:ZT_DAYS
          Write-Host "Using days value: $days"

          Import-Module ZeroTrustAssessment -Force -ErrorAction Stop

          Connect-ZtAssessment -UseTokenCache -Force
          Invoke-ZtAssessment -Path $reportPath -Pillar $env:ZT_PILLAR -Days $days -NoBrowser -ShowLog

          Get-ChildItem -Path $reportPath -Recurse | Select-Object FullName

      - name: Upload Zero Trust assessment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-trust-assessment-${{ github.run_id }}
          path: ${{ github.workspace }}/ZeroTrustReport
