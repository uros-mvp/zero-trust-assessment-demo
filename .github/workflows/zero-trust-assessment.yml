name: Zero Trust Assessment

on:
  workflow_dispatch:
    inputs:
      pillar:
        description: 'Pillar to assess: All, Identity, Devices, Network, Data, Infrastructure, SecOps, AI'
        required: false
        default: 'All'
        type: choice
        options:
          - All
          - Identity
          - Devices
          - Network
          - Data
          - Infrastructure
          - SecOps
          - AI
      days:
        description: 'Number of days to query sign-in logs (1-30)'
        required: false
        default: '7'
        type: string
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  run-zero-trust-assessment:
    name: Run Zero Trust Assessment
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_CERTIFICATE: ${{ secrets.AZURE_CLIENT_CERTIFICATE }}
      AZURE_CLIENT_CERTIFICATE_PASSWORD: ${{ secrets.AZURE_CLIENT_CERTIFICATE_PASSWORD }}
      ZT_PILLAR: ${{ inputs.pillar || 'All' }}
      ZT_DAYS: ${{ inputs.days || '7' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required PowerShell modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          if (-not (Get-Command Install-PSResource -ErrorAction SilentlyContinue)) {
            Install-Module Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -AllowClobber -Repository PSGallery -ErrorAction Stop
          }

          Import-Module Microsoft.PowerShell.PSResourceGet -Force -ErrorAction Stop

          foreach ($moduleName in @('ZeroTrustAssessment', 'Microsoft.Graph.Authentication', 'ExchangeOnlineManagement')) {
            if (-not (Get-Module -ListAvailable -Name $moduleName)) {
              Install-PSResource -Name $moduleName -Scope CurrentUser -TrustRepository -Quiet -ErrorAction Stop
            }
          }

      - name: Install client certificate for app-only auth
        if: ${{ env.AZURE_CLIENT_CERTIFICATE != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_CERTIFICATE)) {
            throw 'AZURE_CLIENT_CERTIFICATE is empty.'
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_CERTIFICATE_PASSWORD)) {
            throw 'AZURE_CLIENT_CERTIFICATE_PASSWORD is empty.'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'zt-assessment.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:AZURE_CLIENT_CERTIFICATE))

          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password (ConvertTo-SecureString -String $env:AZURE_CLIENT_CERTIFICATE_PASSWORD -AsPlainText -Force) | Out-Null

          $cert = Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Subject -match 'ZeroTrustAssessment' } |
            Sort-Object NotBefore -Descending |
            Select-Object -First 1

          if (-not $cert) {
            throw "No certificate matching 'ZeroTrustAssessment' was found in CurrentUser\My after import."
          }

          "ZT_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          $cert | Select-Object Subject, Thumbprint | Format-Table -AutoSize

      - name: Azure login using certificate
        if: ${{ env.AZURE_CLIENT_CERTIFICATE != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          certificate: ${{ secrets.AZURE_CLIENT_CERTIFICATE }}
          enable-AzPSSession: true

      - name: Validate app auth configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID)) {
            throw 'AZURE_CLIENT_ID is required.'
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID)) {
            throw 'AZURE_TENANT_ID is required.'
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_CERTIFICATE)) {
            throw 'AZURE_CLIENT_CERTIFICATE is required for app-only auth.'
          }

          if ([string]::IsNullOrWhiteSpace($env:ZT_CERT_THUMBPRINT)) {
            throw 'Certificate was not installed correctly; ZT_CERT_THUMBPRINT is missing.'
          }

          Write-Host 'Using certificate-based app-only auth for Zero Trust Assessment.'
          Write-Host "TenantId=$env:AZURE_TENANT_ID"
          Write-Host "ClientId=$env:AZURE_CLIENT_ID"
          Write-Host "CertificateThumbprint=$env:ZT_CERT_THUMBPRINT"

          az account show --output table

      - name: Run Zero Trust Assessment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID) -or [string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID)) {
            throw 'AZURE_CLIENT_ID and AZURE_TENANT_ID must be configured.'
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_CERTIFICATE)) {
            throw 'Certificate-based app-only auth is required for ZeroTrustAssessment. Set AZURE_CLIENT_CERTIFICATE and AZURE_CLIENT_CERTIFICATE_PASSWORD in repository secrets.'
          }

          Import-Module ZeroTrustAssessment -Force -ErrorAction Stop
          Import-Module Microsoft.Graph.Authentication -Force -ErrorAction Stop

          $reportPath = Join-Path $env:GITHUB_WORKSPACE 'ZeroTrustReport'
          New-Item -ItemType Directory -Path $reportPath -Force | Out-Null

          $days = [int]$env:ZT_DAYS
          Write-Host "Using pillar: $env:ZT_PILLAR"
          Write-Host "Using days value: $days"
          Write-Host "Using certificate-thumbprint: $env:ZT_CERT_THUMBPRINT"

          $certSelector = if ($env:ZT_CERT_THUMBPRINT) { $env:ZT_CERT_THUMBPRINT } else { 'CN=ZeroTrustAssessment' }
          Write-Host "Connecting ZT Assessment using certificate selector: $certSelector"
          Connect-ZtAssessment -ClientId $env:AZURE_CLIENT_ID -TenantId $env:AZURE_TENANT_ID -Certificate $certSelector -Service All -Force

          Invoke-ZtAssessment -Path $reportPath -Pillar $env:ZT_PILLAR -Days $days -NoBrowser -ShowLog

          Get-ChildItem -Path $reportPath -Recurse | Select-Object FullName

      - name: Upload Zero Trust assessment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-trust-assessment-${{ github.run_id }}
          path: ${{ github.workspace }}/ZeroTrustReport
