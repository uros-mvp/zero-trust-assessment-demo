name: Zero Trust Assessment

on:
  workflow_dispatch:
    inputs:
      pillar:
        description: 'Pillar to assess: All, Identity, Devices, Network, Data, Infrastructure, SecOps, AI'
        required: false
        default: 'All'
        type: choice
        options:
          - All
          - Identity
          - Devices
          - Network
          - Data
          - Infrastructure
          - SecOps
          - AI
      days:
        description: 'Number of days to query sign-in logs (1-30)'
        required: false
        default: '7'
        type: string
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read
  id-token: write

jobs:
  run-zero-trust-assessment:
    name: Run Zero Trust Assessment
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_CERTIFICATE_BASE64: ${{ secrets.AZURE_CLIENT_CERTIFICATE_BASE64 }}
      AZURE_CLIENT_CERTIFICATE_PASSWORD: ${{ secrets.AZURE_CLIENT_CERTIFICATE_PASSWORD }}
      ZT_PILLAR: ${{ inputs.pillar || 'All' }}
      ZT_DAYS: ${{ inputs.days || '7' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required PowerShell modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          if (-not (Get-Command Install-PSResource -ErrorAction SilentlyContinue)) {
            Install-Module Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -AllowClobber -Repository PSGallery -ErrorAction Stop
          }

          Import-Module Microsoft.PowerShell.PSResourceGet -Force -ErrorAction Stop

          foreach ($moduleName in @('ZeroTrustAssessment', 'Microsoft.Graph.Authentication', 'ExchangeOnlineManagement')) {
            if (-not (Get-Module -ListAvailable -Name $moduleName)) {
              Install-PSResource -Name $moduleName -Scope CurrentUser -TrustRepository -Quiet -ErrorAction Stop
            }
          }

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Validate Azure authentication
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID)) {
            throw 'AZURE_CLIENT_ID is required.'
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID)) {
            throw 'AZURE_TENANT_ID is required.'
          }

          Write-Host 'Using OIDC federated authentication for Zero Trust Assessment.'
          Write-Host "TenantId=$env:AZURE_TENANT_ID"
          Write-Host "ClientId=$env:AZURE_CLIENT_ID"

          az account show --output table

      - name: Install client certificate for non-interactive auth
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_CERTIFICATE_BASE64)) {
            throw 'AZURE_CLIENT_CERTIFICATE_BASE64 is required for certificate-based Microsoft Graph authentication in GitHub Actions.'
          }

          try {
            $pfxBytes = [System.Convert]::FromBase64String($env:AZURE_CLIENT_CERTIFICATE_BASE64)
          }
          catch {
            throw "AZURE_CLIENT_CERTIFICATE_BASE64 is not valid Base64. Ensure the secret is exported as a valid PFX and not a CER file. $($_.Exception.Message)"
          }

          if ($pfxBytes.Length -eq 0) {
            throw 'AZURE_CLIENT_CERTIFICATE_BASE64 decoded to zero bytes. The secret is empty or invalid.'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'ZeroTrustAssessmentClient.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          $securePassword = $null
          $passwordText = $null
          if (-not [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_CERTIFICATE_PASSWORD)) {
            $passwordText = $env:AZURE_CLIENT_CERTIFICATE_PASSWORD
            $securePassword = ConvertTo-SecureString -String $passwordText -AsPlainText -Force
          }

          try {
            $keyFlags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable -bor [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            $validationCert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxBytes, $passwordText, $keyFlags)
            if (-not $validationCert.HasPrivateKey) {
              throw 'The imported certificate does not contain a private key.'
            }
          }
          catch {
            throw "The certificate in AZURE_CLIENT_CERTIFICATE_BASE64 is not a valid PFX with a private key, or AZURE_CLIENT_CERTIFICATE_PASSWORD is wrong. $($_.Exception.Message)"
          }

          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword -ErrorAction Stop | Out-Null

          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.HasPrivateKey } | Sort-Object NotAfter -Descending | Select-Object -First 1
          if (-not $cert) {
            throw 'No certificate with a private key was installed for Graph authentication.'
          }

          Write-Host "Installed certificate thumbprint: $($cert.Thumbprint)"
          "AZURE_CLIENT_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Run Zero Trust Assessment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $reportPath = Join-Path $env:GITHUB_WORKSPACE 'ZeroTrustReport'
          New-Item -ItemType Directory -Path $reportPath -Force | Out-Null

          $tenantId = $env:AZURE_TENANT_ID
          $clientId = $env:AZURE_CLIENT_ID
          $thumbprint = $null
          $days = [int]$env:ZT_DAYS

          function Write-BlockedReport {
            param(
              [Parameter(Mandatory = $true)][string]$Reason,
              [string]$TenantId = $env:AZURE_TENANT_ID,
              [string]$ClientId = $env:AZURE_CLIENT_ID,
              [string]$Thumbprint = $null,
              [string]$Extra = ''
            )

            $blockedFile = Join-Path $reportPath 'ZeroTrustAssessment-blocked.txt'
            @(
              $Reason,
              '',
              "Timestamp: $(Get-Date -Format o)",
              "TenantId: $TenantId",
              "ClientId: $ClientId",
              if (-not [string]::IsNullOrWhiteSpace($Thumbprint)) { "Thumbprint: $Thumbprint" } else { $null },
              '',
              $Extra
            ) | Where-Object { $_ -ne $null } | Set-Content -Path $blockedFile -Encoding UTF8

            Write-Warning $Reason
          }

          try {
            if ([string]::IsNullOrWhiteSpace($clientId) -or [string]::IsNullOrWhiteSpace($tenantId)) {
              throw 'AZURE_CLIENT_ID and AZURE_TENANT_ID must be configured.'
            }

            if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_CERTIFICATE_THUMBPRINT)) {
              throw 'AZURE_CLIENT_CERTIFICATE_THUMBPRINT is required for certificate-based Microsoft Graph authentication.'
            }

            Write-Host "Using pillar: $env:ZT_PILLAR"
            Write-Host "Using days value: $days"

            $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Thumbprint -eq $env:AZURE_CLIENT_CERTIFICATE_THUMBPRINT } | Select-Object -First 1
            if (-not $cert) {
              throw "Certificate with thumbprint $env:AZURE_CLIENT_CERTIFICATE_THUMBPRINT was not found in CurrentUser\My."
            }

            $thumbprint = $cert.Thumbprint
            Write-Host "Using certificate thumbprint: $thumbprint"

            foreach ($moduleName in @('ZeroTrustAssessment', 'Microsoft.Graph.Authentication', 'ExchangeOnlineManagement')) {
              try {
                Import-Module $moduleName -Force -ErrorAction Stop
                Write-Host "Imported module: $moduleName"
              }
              catch {
                Write-Warning "Failed to import $($moduleName): $($_.Exception.Message)"
              }
            }

            $graphContext = $null
            try {
              Write-Host 'Authenticating to Microsoft Graph using the configured certificate.'
              Connect-MgGraph -ClientId $clientId -TenantId $tenantId -CertificateThumbprint $thumbprint -NoWelcome -ErrorAction Stop
              $graphContext = Get-MgContext
            }
            catch {
              $graphContext = $null
              Write-Warning "Microsoft Graph certificate authentication failed: $($_.Exception.Message)"
            }

            if (-not $graphContext -or [string]::IsNullOrWhiteSpace($graphContext.TenantId)) {
              Write-BlockedReport -Reason 'Zero Trust Assessment was not run in this GitHub-hosted runner because the module still requires browser-based Microsoft Graph authentication in a headless environment.' -TenantId $tenantId -ClientId $clientId -Thumbprint $thumbprint -Extra 'Reason: Microsoft Graph context was not established after certificate-based authentication.'
              Get-ChildItem -Path $reportPath -Recurse | Select-Object FullName
              return
            }

            Write-Host "Graph context established for tenant $($graphContext.TenantId)."

            Write-Host 'Attempting Exchange Online certificate authentication without browser interaction.'
            try {
              Connect-ExchangeOnline -CertificateThumbprint $thumbprint -AppId $clientId -Organization $tenantId -ShowBanner:$false -ErrorAction Stop
            }
            catch {
              Write-Warning "Exchange Online certificate authentication was not available in this environment: $($_.Exception.Message)"
            }

            Write-Host 'Attempting Security & Compliance certificate authentication without browser interaction.'
            try {
              Connect-IPPSSession -CertificateThumbprint $thumbprint -AppId $clientId -Organization $tenantId -ErrorAction Stop
            }
            catch {
              Write-Warning "Security & Compliance certificate authentication was not available in this environment: $($_.Exception.Message)"
            }

            try {
              $spoAdminUrl = "https://$tenantId-admin.sharepoint.com"
              Connect-SPOService -Url $spoAdminUrl -ClientId $clientId -CertificateThumbprint $thumbprint -ErrorAction Stop
            }
            catch {
              Write-Warning "SharePoint Online certificate authentication was not available in this environment: $($_.Exception.Message)"
            }

            try {
              $customReportPath = Join-Path $reportPath 'ZeroTrustAssessment-report.json'
              $htmlReportPath = Join-Path $reportPath 'ZeroTrustAssessment-summary.html'
              $checks = @()

              function Add-ReportCheck {
                param(
                  [Parameter(Mandatory = $true)][string]$Name,
                  [Parameter(Mandatory = $true)][string]$Status,
                  [Parameter(Mandatory = $true)][string]$Detail,
                  [hashtable]$Properties = @{}
                )

                $entry = [ordered]@{
                  name = $Name
                  status = $Status
                  detail = $Detail
                }

                foreach ($property in $Properties.GetEnumerator()) {
                  $entry[$property.Key] = $property.Value
                }

                $script:checks += [pscustomobject]$entry
              }

              Add-ReportCheck -Name 'GraphContext' -Status 'success' -Detail 'Certificate-based Microsoft Graph context was established.' -Properties @{ tenantId = $tenantId; clientId = $clientId; thumbprint = $thumbprint }

              try {
                $sampleUsers = @(Get-MgUser -Top 5 -Select UserPrincipalName, Id, AccountEnabled -ErrorAction Stop)
                Add-ReportCheck -Name 'Users' -Status 'success' -Detail 'Queried a sample of user objects from Microsoft Graph.' -Properties @{ count = $sampleUsers.Count }
              }
              catch {
                Add-ReportCheck -Name 'Users' -Status 'warning' -Detail $_.Exception.Message -Properties @{ count = 0 }
              }

              try {
                $caPolicies = @(Get-MgConditionalAccessPolicy -Top 10 -ErrorAction Stop)
                Add-ReportCheck -Name 'ConditionalAccessPolicies' -Status 'success' -Detail 'Queried Microsoft Entra conditional access policies.' -Properties @{ count = $caPolicies.Count }
              }
              catch {
                Add-ReportCheck -Name 'ConditionalAccessPolicies' -Status 'warning' -Detail $_.Exception.Message -Properties @{ count = 0 }
              }

              try {
                $securityDefaults = Get-MgPolicyIdentitySecurityDefaultEnforcementPolicy -ErrorAction Stop
                Add-ReportCheck -Name 'SecurityDefaults' -Status 'success' -Detail 'Security defaults state was queried successfully.' -Properties @{ isEnabled = $securityDefaults.IsEnabled }
              }
              catch {
                Add-ReportCheck -Name 'SecurityDefaults' -Status 'warning' -Detail $_.Exception.Message -Properties @{ isEnabled = $false }
              }

              $report = [ordered]@{
                generatedAt = (Get-Date).ToString('o')
                source = 'GitHub-hosted headless runner'
                reportType = 'custom-zero-trust-assessment'
                pillar = $env:ZT_PILLAR
                days = $days
                tenantId = $tenantId
                clientId = $clientId
                authenticationMode = 'certificate'
                checks = $checks
              }

              $report | ConvertTo-Json -Depth 8 | Set-Content -Path $customReportPath -Encoding UTF8

              $htmlRows = @()
              foreach ($check in $checks) {
                $statusColor = if ($check.status -eq 'success') { 'green' } elseif ($check.status -eq 'warning') { 'orange' } else { 'red' }
                $htmlRows += @(
                  '              <tr>',
                  "                <td>$($check.name)</td>",
                  "                <td><span style=`"color:$statusColor;font-weight:bold;`">$($check.status)</span></td>",
                  "                <td>$($check.detail)</td>",
                  '              </tr>'
                )
              }

              $htmlLines = @(
                '<html>',
                '<head>',
                '  <title>Zero Trust Assessment Summary</title>',
                '  <style>',
                '    body { font-family: Segoe UI, Arial, sans-serif; margin: 32px; color: #1f2937; }',
                '    h1 { color: #111827; }',
                '    table { border-collapse: collapse; width: 100%; margin-top: 20px; }',
                '    th, td { border: 1px solid #d1d5db; padding: 10px 12px; text-align: left; vertical-align: top; }',
                '    th { background: #f3f4f6; }',
                '    .meta { margin-bottom: 16px; line-height: 1.7; }',
                '  </style>',
                '</head>',
                '<body>',
                '  <h1>Zero Trust Assessment Summary</h1>',
                '  <div class="meta">',
                "    <strong>Generated:</strong> $((Get-Date).ToString('yyyy-MM-dd HH:mm:ss'))<br />",
                '    <strong>Source:</strong> GitHub-hosted headless runner<br />',
                "    <strong>Pillar:</strong> $($env:ZT_PILLAR)<br />",
                "    <strong>Days:</strong> $days<br />",
                "    <strong>Tenant:</strong> $tenantId<br />",
                "    <strong>Client:</strong> $clientId",
                '  </div>',
                '  <table>',
                '    <thead>',
                '      <tr>',
                '        <th>Name</th>',
                '        <th>Status</th>',
                '        <th>Detail</th>',
                '      </tr>',
                '    </thead>',
                '    <tbody>',
                $htmlRows,
                '    </tbody>',
                '  </table>',
                '</body>',
                '</html>'
              )

              $htmlLines | Set-Content -Path $htmlReportPath -Encoding UTF8

              Write-Host "Custom headless Zero Trust report was generated at $customReportPath"
              Write-Host "HTML summary report was generated at $htmlReportPath"
              Get-ChildItem -Path $reportPath -Recurse | Select-Object FullName
            }
            catch {
              $message = $_.Exception.Message
              Write-BlockedReport -Reason 'Zero Trust Assessment could not complete in this GitHub-hosted runner using the native module. A direct headless Graph report was attempted instead, but it failed.' -TenantId $tenantId -ClientId $clientId -Thumbprint $thumbprint -Extra "Error: $message"
            }
          }
          catch {
            $message = $_.Exception.Message
            Write-BlockedReport -Reason 'Zero Trust Assessment could not start correctly in this GitHub-hosted runner.' -TenantId $tenantId -ClientId $clientId -Thumbprint $thumbprint -Extra "Error: $message"
          }

          Get-ChildItem -Path $reportPath -Recurse | Select-Object FullName

      - name: Upload Zero Trust assessment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-trust-assessment-${{ github.run_id }}
          path: ${{ github.workspace }}/ZeroTrustReport
